<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ember & Blade: Dungeon Crawler</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#4a148c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ember & Blade" />
    <link rel="apple-touch-icon" href="assets/sprites/app_icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #0d1117;
        --accent-color: #a8c686;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--bg-color);
        overflow: hidden;
        touch-action: none;
        font-family: 'VT323', monospace;
      }

      #game-root {
        width: 100vw;
        height: var(--app-height, 100vh);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent-color);
        font-size: 1.2rem;
      }

      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #0d1117;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.6s ease-out;
      }

      .splash-logo {
        width: 160px;
        height: 160px;
        margin-bottom: 24px;
        filter: drop-shadow(0 0 15px rgba(106, 27, 154, 0.4));
        animation: pulse 2.2s infinite ease-in-out;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.06); opacity: 1; }
      }

      .loading-text {
        font-family: 'Press Start 2P', cursive;
        font-size: 12px;
        color: #ffca28;
        letter-spacing: 2px;
        text-shadow: 0 0 10px rgba(255, 202, 40, 0.3);
      }

      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <img src="assets/sprites/app_icon.svg" class="splash-logo" alt="Ember & Blade Logo" />
      <div class="loading-text">LOADING...</div>
    </div>
    <div id="game-root"></div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser3-rex-plugins@1.1.59/dist/rexvirtualjoystickplugin.min.js"></script>
    <script>
      const applyViewportSize = () => {
        const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        document.documentElement.style.setProperty('--app-height', `${Math.round(viewportHeight)}px`);
      };

      applyViewportSize();
      window.addEventListener('resize', applyViewportSize, { passive: true });
      window.addEventListener('orientationchange', applyViewportSize, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', applyViewportSize, { passive: true });
      }
    </script>
    <script type="module" src="main.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }, err => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
