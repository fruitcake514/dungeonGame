<!DOCTYPE html>
<html lang="en">

      * {
        box-sizing: border-box;

      /* Inventory */

      #orientationPrompt {

  display: none;

}

#joystickArea {

}

          display: block;

      <div>
        <img src="rotate-device.svg" alt="Rotate your device" style="width: 64px; height: 64px; margin-bottom: 20px;">

    <div id="startScreen">

    <div id="container">
      <div id="gameWrapper">
        <div id="hud">
          <div id="healthBar">
            <div id="healthFill"></div>
          </div>
          <div id="scoreDisplay">Score: 0</div>
        </div>
        <div id="inventoryBar"></div>
        <canvas id="gameCanvas"></canvas>
        
        <div id="touchControls">
  <div id="joystickArea">
    <div id="joystick"></div>
  </div>
  <button id="actionButton">Attack</button>
</div>

    <script>
      // Game Classes and Constants from your original code
      let canvas, ctx;
      let player;
      let enemies = [];
      let boss;
      let dungeonLevel = 1;
      let keys = {};
      let cameraX = 0, cameraY = 0;
      let dungeonWidth = 2000, dungeonHeight = 2000;
      let score = 0;
      let gameOver = false;
      let weapons = [];
      let currentWeapon = null;
      let inventory = [];
      let projectiles = [];
      let portal = null;
      let walls = [];
      let isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      let joystickPos = { x: 0, y: 0 };

      // Your original game classes
      class Player {
        constructor(x, y, size, color) {
          this.x = x;
          this.y = y;
          this.size = size;
          this.color = color;
          this.maxHealth = 100;
          this.health = this.maxHealth;
        }
        render(ctx) {
          ctx.fillStyle = this.color;
          ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
        }
        intersects(other) {
          const dx = this.x - other.x;
          const dy = this.y - other.y;
          return Math.sqrt(dx * dx + dy * dy) < (this.size + other.size) / 2;
        }
      }

      // [Include all your other class definitions: Enemy, Boss, Portal, Weapon, Projectile, Wall]
    

      // Mobile Controls Setup
      if (isMobile) {
        const joystick = document.getElementById('joystick');
        const joystickArea = document.getElementById('joystickArea');
        let joystickActive = false;
        joystickArea.addEventListener('touchstart', handleJoystickStart);
        joystickArea.addEventListener('touchmove', handleJoystickMove);
        joystickArea.addEventListener('touchend', handleJoystickEnd);

        function handleJoystickStart(e) {
          e.preventDefault();
          joystickActive = true;
          updateJoystickPosition(e.touches[0]);
        }

        function handleJoystickMove(e) {
          e.preventDefault();
          if (joystickActive) {
            updateJoystickPosition(e.touches[0]);
          }
        }

        function handleJoystickEnd(e) {
          e.preventDefault();
          joystickActive = false;
          joystick.style.transform = 'translate(0px, 0px)';
          joystickPos = { x: 0, y: 0 };
        }

        function updateJoystickPosition(touch) {
          const rect = joystickArea.getBoundingClientRect();
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          
          let x = touch.clientX - rect.left - centerX;
          let y = touch.clientY - rect.top - centerY;
          
          const maxDistance = rect.width / 2 - joystick.offsetWidth / 2;
          const distance = Math.sqrt(x * x + y * y);
          
          if (distance > maxDistance) {
            const angle = Math.atan2(y, x);
            x = Math.cos(angle) * maxDistance;
            y = Math.sin(angle) * maxDistance;
          }
          
          joystick.style.transform = `translate(${x}px, ${y}px)`;
          joystickPos = {
            x: x / maxDistance,
            y: y / maxDistance
          };

          // Update player movement based on joystick
          if (player) {
            const speed = 5;
            const newX = player.x + joystickPos.x * speed;
            const newY = player.y + joystickPos.y * speed;
            
            // Apply movement within bounds
            player.x = Math.max(Math.min(newX, dungeonWidth - player.size), player.size);
            player.y = Math.max(Math.min(newY, dungeonHeight - player.size), player.size);
          }
        }

        // Mobile Action Button
        document.getElementById('actionButton').addEventListener('touchstart', (e) => {
          e.preventDefault();
          if (currentWeapon) {
            if (currentWeapon.type === 'Bow' || currentWeapon.type === 'Wand') {
              shootProjectile(player.x + 50, player.y); // Shoot right by default on mobile
            } else {
              meleeAttack(player.x + 50, player.y);
            }
          }
        });
      }

      // Modified handlePlayerMovement for both mobile and desktop
      function handlePlayerMovement() {
        if (!player) return;
        
        const speed = 200 / 60;
        let newX = player.x;
        let newY = player.y;

        if (isMobile) {
          document.getElementById('touchControls').style.display = 'block';
          // Mobile movement using joystick position
          newX += joystickPos.x * speed;
          newY += joystickPos.y * speed;
        } else {
          // Desktop keyboard controls
          if (keys['a'] || keys['ArrowLeft']) newX -= speed;
          if (keys['d'] || keys['ArrowRight']) newX += speed;
          if (keys['w'] || keys['ArrowUp']) newY -= speed;
          if (keys['s'] || keys['ArrowDown']) newY += speed;
        }

        // Boundary and collision checks
        newX = Math.max(Math.min(newX, dungeonWidth - player.size), player.size);
        newY = Math.max(Math.min(newY, dungeonHeight - player.size), player.size);

        let collision = false;
        for (let wall of walls) {
          if (wall.intersects(newX, newY, player.size)) {
            collision = true;
            break;
          }
        }

        if (!collision) {
          player.x = newX;
          player.y = newY;
        }

        // Update camera position
        cameraX = Math.max(Math.min(player.x - canvas.width/2, dungeonWidth - canvas.width), 0);
        cameraY = Math.max(Math.min(player.y - canvas.height/2, dungeonHeight - canvas.height), 0);
      }

      // Canvas Resize Handler
      function resizeCanvas() {
        const wrapper = document.getElementById('gameWrapper');
        canvas.width = wrapper.offsetWidth;
        canvas.height = wrapper.offsetHeight;
      }

      // Initialize game
      function init() {
        canvas = document.getElementById('gameCanvas');
        ctx = canvas.getContext('2d');
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Initialize player and game elements
        player = new Player(400, 300, 20, 'red');
        generateDungeon();
        
        if (!isMobile) {
  document.addEventListener('keydown', keyDownHandler);
  document.addEventListener('keyup', keyUpHandler);
 canvas.addEventListener('click', mouseDownHandler);
}
if (isMobile) {
    document.getElementById('touchControls').style.display = 'block';
}

        // Start game loop
        requestAnimationFrame(gameLoop);
      }

      class Weapon {
  constructor(x, y, size, color, type) {
    this.x = x;
    this.y = y;
    this.size = size;
    this.color = color;
    this.type = type;
    this.stats = getWeaponStats(type);
  }

  render(ctx) {
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
    
    ctx.fillStyle = 'white';
    ctx.font = '12px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(this.type[0], this.x, this.y + 4);
  }

 use(x, y, targetX, targetY) {
  if (this.type === 'Bow') {
    const angle = Math.atan2(targetY - y, targetX - x);
    const speed = this.stats.projectileSpeed;
    return [new Projectile(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, 10, 'brown', this.stats.damage)];
  } else if (this.type === 'Wand') {
    const projectiles = [];
    for (let i = 0; i < 360; i += 45) {
      const angle = i * (Math.PI / 180);
      const speed = this.stats.projectileSpeed;
      projectiles.push(new Projectile(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, 10, 'blue', this.stats.damage));
    }
    return projectiles;
  } else {
    return { damage: this.stats.damage, range: this.size * 2 };
  }
}
}

class Projectile {
  constructor(x, y, dx, dy, size, color, damage) {
    this.x = x;
    this.y = y;
    this.dx = dx;
    this.dy = dy;
    this.size = size;
    this.color = color;
    this.damage = damage;
    this.active = true;
  }

  update() {
    this.x += this.dx;
    this.y += this.dy;
    
    if (this.x < 0 || this.x > dungeonWidth || 
        this.y < 0 || this.y > dungeonHeight) {
      this.active = false;
    }
  }

  render(ctx) {
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size/2, 0, Math.PI * 2);
    ctx.fill();
  }

  intersects(target) {
    const dx = this.x - target.x;
    const dy = this.y - target.y;
    const distance = Math.sqrt(dx * dx + dy * dy);
    return distance < (this.size + target.size) / 2;
  }
}

function keyDownHandler(e) {
  if (gameOver) return;
  keys[e.key.toLowerCase()] = true;
  
  // Prevent default for game controls
  if (['w', 'a', 's', 'd', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
    e.preventDefault();
  }
}

function keyUpHandler(e) {
  keys[e.key.toLowerCase()] = false;
}

function mouseDownHandler(e) {
  if (gameOver) return;

  const rect = canvas.getBoundingClientRect();
  const mouseX = e.clientX - rect.left + cameraX;
  const mouseY = e.clientY - rect.top + cameraY;

  if (!currentWeapon) return; // Ensure a weapon is equipped
  
  if (currentWeapon.type === 'Bow' || currentWeapon.type === 'Wand') {
    shootProjectile(mouseX, mouseY);
  } else {
    meleeAttack(mouseX, mouseY);
  }
}


function shootProjectile(targetX, targetY) {
  if (!currentWeapon) return;

  const projectiles = currentWeapon.use(player.x, player.y, targetX, targetY);
  if (projectiles) {
    projectiles.forEach(projectile => projectiles.push(projectile));
  }
}

function meleeAttack(targetX, targetY) {
  if (!currentWeapon) return;
  
  const attack = currentWeapon.use(player.x, player.y, targetX, targetY);
  const range = attack.range;
  const damage = attack.damage;
  
  // Check enemy hits
  enemies = enemies.filter(enemy => {
    const dx = enemy.x - player.x;
    const dy = enemy.y - player.y;
    const distance = Math.sqrt(dx * dx + dy * dy);
    
    if (distance <= range) {
      enemy.health -= damage;
      if (enemy.health <= 0) {
        score += 10;
        return false;
      }
    }
    return true;
  });
  
  // Check boss hit
  if (boss) {
    const dx = boss.x - player.x;
    const dy = boss.y - player.y;
    const distance = Math.sqrt(dx * dx + dy * dy);
    
    if (distance <= range) {
      boss.health -= damage;
      if (boss.health <= 0) {
        score += 100;
        boss = null;
      }
    }
  }
}

function updateProjectiles() {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const projectile = projectiles[i];
    projectile.update();
    
    // Check enemy hits
    enemies = enemies.filter(enemy => {
      if (projectile.active && projectile.intersects(enemy)) {
        enemy.health -= projectile.damage;
        projectile.active = false;
        if (enemy.health <= 0) {
          score += 10;
          return false;
        }
      }
      return true;
    });
    
    // Check boss hit
    if (boss && projectile.active && projectile.intersects(boss)) {
      boss.health -= projectile.damage;
      projectile.active = false;
      if (boss.health <= 0) {
        score += 100;
        boss = null;
      }
    }
    
    // Remove inactive projectiles
    if (!projectile.active) {
      projectiles.splice(i, 1);
    }
  }
}

function checkWeaponPickup() {
  weapons.forEach((weapon, index) => {
    if (player.intersects(weapon)) {
      inventory.push(weapon);
      weapons.splice(index, 1);
      if (!currentWeapon) currentWeapon = weapon;
      updateInventoryUI();
    }
  });
}

function updateInventoryUI() {
  const inventoryBar = document.getElementById('inventoryBar');
  inventoryBar.innerHTML = '';

  inventory.forEach((weapon, index) => {
    const slot = document.createElement('div');
    slot.className = 'invItem';
    if (currentWeapon === weapon) {
      slot.classList.add('active');
    }
    
    slot.innerHTML = `<div style="color: white; text-align: center; line-height: 50px;">${weapon.type[0]}</div>`;
    
    slot.addEventListener('click', () => {
      currentWeapon = weapon;
      updateInventoryUI();
    });

    if (!isMobile) {
      const keyHint = document.createElement('div');
      keyHint.style.position = 'absolute';
      keyHint.style.top = '2px';
      keyHint.style.left = '2px';
      keyHint.style.fontSize = '10px';
      keyHint.textContent = index + 1;
      slot.appendChild(keyHint);
    }

    inventoryBar.appendChild(slot);
  });
}
// Add keyboard shortcuts for inventory selection
document.addEventListener('keydown', (e) => {
  if (!isMobile) {
    const num = parseInt(e.key);
    if (num >= 1 && num <= inventory.length) {
      currentWeapon = inventory[num - 1];
      updateInventoryUI();
    }
  }
});

      function gameLoop() {
        if (!gameOver) {
          update();
          render();
        } else {
          renderGameOver();
        }
        requestAnimationFrame(gameLoop);
      }
	// Update the score values when killing enemies in damagePlayer function
function checkDungeonCompletion() {
  if (enemies.length === 0 && !boss) {
    dungeonLevel++;
    score += 1000; // Bonus for clearing all enemies
    generateDungeon();
  } else if (enemies.length === 0 && boss && boss.health <= 0) {
    boss = null;
    score += 500; // Boss kill bonus
    generatePortal();
  }
}

  if (!currentWeapon) return;

        if (projectile.active && projectile.intersects(enemy)) {

          if (enemy.health <= 0) {
            score += 100; // Enemy kill score

          }

      });

// Helper function to check if a position is valid (not inside walls)
function isValidPosition(x, y, size) {
  for (let wall of walls) {
    if (wall.intersects(x, y, size)) {
      return false;
    }
  }
  return true;
}

// Helper function to get a random valid position
function getRandomValidPosition(size) {
  let x, y;
  let attempts = 0;
  const maxAttempts = 100;

  do {
    x = Math.random() * (dungeonWidth - size * 2) + size;
    y = Math.random() * (dungeonHeight - size * 2) + size;
    attempts++;
  } while (!isValidPosition(x, y, size) && attempts < maxAttempts);

  if (attempts >= maxAttempts) {
    // If we can't find a spot after max attempts, try to find any open corner
    const corners = [
      [size, size],
      [dungeonWidth - size, size],
      [size, dungeonHeight - size],
      [dungeonWidth - size, dungeonHeight - size]
    ];
    
    for (let [cornerX, cornerY] of corners) {
      if (isValidPosition(cornerX, cornerY, size)) {
        return { x: cornerX, y: cornerY };
      }
    }
  }

  return { x, y };
}

// Update generateDungeon to use valid positions
function generateDungeon() {
  enemies = [];
  boss = null;
  weapons = [];
  projectiles = [];
  portal = null;
  walls = [];

  // Generate walls first
  for (let i = 0; i < 10; i++) {
    const wallX = Math.random() * (dungeonWidth - 200);
    const wallY = Math.random() * (dungeonHeight - 200);
    const wallWidth = 50 + Math.random() * 150;
    const wallHeight = 50 + Math.random() * 150;
    walls.push(new Wall(wallX, wallY, wallWidth, wallHeight, 'gray'));
  }

  // Generate enemies in valid positions
  for (let i = 0; i < 10 + dungeonLevel * 2; i++) {
    const enemySize = 20 + dungeonLevel * 2;
    const enemyHealth = 20 + dungeonLevel * 5;
    const pos = getRandomValidPosition(enemySize);
    enemies.push(new Enemy(pos.x, pos.y, enemySize, 'green', enemyHealth));
  }

  // Generate boss in valid position
  const bossSize = 40 + dungeonLevel * 5;
  const bossHealth = 100 + dungeonLevel * 50;
  const bossPos = getRandomValidPosition(bossSize);
  boss = new Boss(bossPos.x, bossPos.y, bossSize, 'purple', bossHealth);

  // Generate weapon in valid position
  const weaponPos = getRandomValidPosition(20);
  const weaponType = getRandomWeaponType();
  weapons.push(new Weapon(weaponPos.x, weaponPos.y, 20, 'brown', weaponType));

  updateInventoryUI();
}

// Update enemy movement to respect walls
function updateEnemyPosition(enemy, newX, newY) {
  if (isValidPosition(newX, newY, enemy.size)) {
    enemy.x = newX;
    enemy.y = newY;
    return true;
  }
  return false;
}


// Update portal generation to use valid position
function generatePortal() {
  const portalSize = 40;
  const portalPos = getRandomValidPosition(portalSize);
  portal = new Portal(portalPos.x, portalPos.y, portalSize, 'yellow');
}

class Enemy {
  constructor(x, y, size, color, health, type = 'basic') {
    this.x = x;
    this.y = y;
    this.size = size;
    this.baseColor = color;
    this.color = color;
    this.health = health;
    this.maxHealth = health;
    this.type = type;
    
    // Movement properties
    this.speed = this.getTypeSpeed();
    this.direction = Math.random() * Math.PI * 2;
    this.wanderTimer = 0;
    this.wanderInterval = 60;
    
    // Attack properties
    this.attackRange = this.getTypeRange();
    this.damage = this.getTypeDamage();
    this.attackCooldown = 0;
    this.attackInterval = this.getTypeAttackInterval();
    
    // Special properties
    this.projectiles = [];
    this.dashCooldown = 0;
    this.isCharging = false;
    this.chargeTarget = null;
    this.stunned = false;
    this.stunDuration = 0;
  }

  getTypeSpeed() {
    const speeds = {
      'basic': 1,
      'fast': 2,
      'ranged': 0.7,
      'tank': 0.5,
      'berserker': 1.5
    };
    return speeds[this.type] || 1;
  }

  getTypeRange() {
    const ranges = {
      'basic': 30,
      'fast': 25,
      'ranged': 200,
      'tank': 35,
      'berserker': 40
    };
    return ranges[this.type] || 30;
  }

  getTypeDamage() {
    const damages = {
      'basic': 10,
      'fast': 5,
      'ranged': 8,
      'tank': 15,
      'berserker': 20
    };
    return damages[this.type] || 10;
  }

  getTypeAttackInterval() {
    const intervals = {
      'basic': 60,
      'fast': 45,
      'ranged': 90,
      'tank': 120,
      'berserker': 30
    };
    return intervals[this.type] || 60;
  }

  render(ctx) {
    // Base enemy shape
    ctx.fillStyle = this.stunned ? '#666666' : this.color;
    
    if (this.type === 'tank') {
      // Square with thick border
      ctx.strokeStyle = '#444444';
      ctx.lineWidth = 4;
      ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
      ctx.strokeRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
    } else if (this.type === 'ranged') {
      // Diamond shape
      ctx.beginPath();
      ctx.moveTo(this.x, this.y - this.size/2);
      ctx.lineTo(this.x + this.size/2, this.y);
      ctx.lineTo(this.x, this.y + this.size/2);
      ctx.lineTo(this.x - this.size/2, this.y);
      ctx.closePath();
      ctx.fill();
    } else if (this.type === 'fast') {
      // Triangle
      ctx.beginPath();
      ctx.moveTo(this.x, this.y - this.size/2);
      ctx.lineTo(this.x + this.size/2, this.y + this.size/2);
      ctx.lineTo(this.x - this.size/2, this.y + this.size/2);
      ctx.closePath();
      ctx.fill();
    } else if (this.type === 'berserker') {
      // Spiked square
      const spikes = 8;
      ctx.beginPath();
      for (let i = 0; i < spikes * 2; i++) {
        const angle = (i * Math.PI) / spikes;
        const radius = i % 2 === 0 ? this.size/2 : this.size/3;
        const x = this.x + Math.cos(angle) * radius;
        const y = this.y + Math.sin(angle) * radius;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
    } else {
      // Basic square
      ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
    }

    // Health bar
    const barWidth = this.size * 1.5;
    const barHeight = 5;
    const barX = this.x - barWidth/2;
    const barY = this.y - this.size/2 - 10;
    
    // Health bar background
    ctx.fillStyle = '#800000';
    ctx.fillRect(barX, barY, barWidth, barHeight);
    
    // Current health
    ctx.fillStyle = 'limegreen';
    ctx.fillRect(barX, barY, barWidth * (this.health/this.maxHealth), barHeight);
    
    // Health bar border
    ctx.strokeStyle = 'black';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, barY, barWidth, barHeight);

    // Render projectiles for ranged enemies
    if (this.type === 'ranged') {
      this.projectiles.forEach(proj => {
        ctx.fillStyle = '#ffff00';
        ctx.beginPath();
        ctx.arc(proj.x, proj.y, 5, 0, Math.PI * 2);
        ctx.fill();
      });
    }
  }

  update(player) {
    if (this.stunned) {
      this.stunDuration--;
      if (this.stunDuration <= 0) {
        this.stunned = false;
      }
      return;
    }

    // Update projectiles for ranged enemies
    if (this.type === 'ranged') {
      this.updateProjectiles(player);
    }

    const dx = player.x - this.x;
    const dy = player.y - this.y;
    const distance = Math.sqrt(dx * dx + dy * dy);

    // Attack cooldown
    if (this.attackCooldown > 0) {
      this.attackCooldown--;
    }

    // Berserker rage mode
    if (this.type === 'berserker' && this.health < this.maxHealth * 0.5) {
      this.color = '#ff0000';
      this.speed = this.getTypeSpeed() * 1.5;
    }

    // Movement and attack behavior based on type
    if (distance < this.attackRange && this.attackCooldown <= 0) {
      this.attack(player, distance);
    } else if (distance < 300) {
      this.moveTowardPlayer(dx, dy, distance);
    } else {
      this.wander();
    }
  }

  attack(player, distance) {
    switch(this.type) {
      case 'ranged':
        this.rangedAttack(player);
        break;
      case 'berserker':
        this.berserkerAttack(player);
        break;
      case 'fast':
        this.dashAttack(player);
        break;
      default:
        this.meleeAttack(player, distance);
    }
    this.attackCooldown = this.attackInterval;
  }

  rangedAttack(player) {
    const angle = Math.atan2(player.y - this.y, player.x - this.x);
    this.projectiles.push({
      x: this.x,
      y: this.y,
      dx: Math.cos(angle) * 5,
      dy: Math.sin(angle) * 5,
      damage: this.damage
    });
  }

  berserkerAttack(player) {
    this.isCharging = true;
    this.chargeTarget = {x: player.x, y: player.y};
    this.speed *= 2;
    setTimeout(() => {
      this.isCharging = false;
      this.speed = this.getTypeSpeed();
    }, 500);
  }

  dashAttack(player) {
    const angle = Math.atan2(player.y - this.y, player.x - this.x);
    const dashDistance = 100;
    const newX = this.x + Math.cos(angle) * dashDistance;
    const newY = this.y + Math.sin(angle) * dashDistance;
    
    if (isValidPosition(newX, newY, this.size)) {
      this.x = newX;
      this.y = newY;
    } else {
      this.stunned = true;
      this.stunDuration = 30;
    }
  }

  meleeAttack(player, distance) {
    if (distance < this.attackRange) {
      player.health -= this.damage;
    }
  }

  moveTowardPlayer(dx, dy, distance) {
    const newX = this.x + (dx / distance) * this.speed;
    const newY = this.y + (dy / distance) * this.speed;
    
    if (isValidPosition(newX, newY, this.size)) {
      this.x = newX;
      this.y = newY;
    }
  }

  wander() {
    this.wanderTimer++;
    if (this.wanderTimer >= this.wanderInterval) {
      this.direction = Math.random() * Math.PI * 2;
      this.wanderTimer = 0;
    }

    const newX = this.x + Math.cos(this.direction) * (this.speed * 0.5);
    const newY = this.y + Math.sin(this.direction) * (this.speed * 0.5);
    
    if (isValidPosition(newX, newY, this.size)) {
      this.x = newX;
      this.y = newY;
    } else {
      this.direction += Math.PI;
    }
  }

  updateProjectiles(player) {
    for (let i = this.projectiles.length - 1; i >= 0; i--) {
      const proj = this.projectiles[i];
      proj.x += proj.dx;
      proj.y += proj.dy;
      
      // Check bounds
      if (proj.x < 0 || proj.x > dungeonWidth || 
          proj.y < 0 || proj.y > dungeonHeight) {
        this.projectiles.splice(i, 1);
        continue;
      }
      
      // Check player collision
      const dx = proj.x - player.x;
      const dy = proj.y - player.y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      
      if (distance < (player.size + 5) / 2) {
        player.health -= proj.damage;
        this.projectiles.splice(i, 1);
      }
    }
  }
}
class Boss {
  constructor(x, y, size, color, health) {
    this.x = x;
    this.y = y;
    this.size = size;
    this.color = color;
    this.health = health;
    this.maxHealth = health;
    
    // Movement properties
    this.speed = 2;
    this.chargeSpeed = 6;
    this.isCharging = false;
    this.chargeTarget = { x: 0, y: 0 };
    
    // Attack properties
    this.attackCooldown = 0;
    this.attackInterval = 120; // frames between attacks
    this.phase = 1; // boss gets harder as health decreases
    this.projectiles = []; // store boss projectiles
    
    // State tracking
    this.lastAttackType = null;
    this.stunned = false;
    this.stunDuration = 0;
  }

  render(ctx) {
    // Base boss render
    ctx.fillStyle = this.stunned ? '#666666' : this.color;
    ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
    
    // Health bar
    const barWidth = this.size, barHeight = 5;
    const barX = this.x - barWidth/2;
    const barY = this.y - this.size/2 - 10;
    
    // Health bar background
    ctx.fillStyle = '#800000';
    ctx.fillRect(barX, barY, barWidth, barHeight);
    
    // Current health
    ctx.fillStyle = 'limegreen';
    ctx.fillRect(barX, barY, barWidth * (this.health/this.maxHealth), barHeight);
    
    // Health bar border
    ctx.strokeStyle = 'black';
    ctx.strokeRect(barX, barY, barWidth, barHeight);
    
    // Phase indicator
    ctx.fillStyle = this.phase === 3 ? '#FF0000' : this.phase === 2 ? '#FFA500' : '#FFFFFF';
    ctx.beginPath();
    ctx.arc(this.x, this.y, 5, 0, Math.PI * 2);
    ctx.fill();
    
    // Render boss projectiles
    this.projectiles.forEach(proj => {
      ctx.fillStyle = proj.color;
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, proj.size, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  update(player) {
    if (this.stunned) {
      this.stunDuration--;
      if (this.stunDuration <= 0) {
        this.stunned = false;
      }
      return;
    }

    // Update phase based on health
    this.phase = this.health < this.maxHealth * 0.33 ? 3 :
                 this.health < this.maxHealth * 0.66 ? 2 : 1;

    // Update projectiles
    this.updateProjectiles();
    
    // Handle attacks
    this.attackCooldown--;
    if (this.attackCooldown <= 0) {
      this.performAttack(player);
    }

    // Movement
    if (this.isCharging) {
      this.handleCharge();
    } else {
      this.handleNormalMovement(player);
    }
  }

  handleNormalMovement(player) {
    const dx = player.x - this.x;
    const dy = player.y - this.y;
    const distance = Math.sqrt(dx * dx + dy * dy);
    
    if (distance > this.size * 2) {
      const angle = Math.atan2(dy, dx);
      const newX = this.x + Math.cos(angle) * this.speed;
      const newY = this.y + Math.sin(angle) * this.speed;
      
      // Check for wall collisions before moving
      if (isValidPosition(newX, newY, this.size)) {
        this.x = newX;
        this.y = newY;
      }
    }
  }

  handleCharge() {
    const dx = this.chargeTarget.x - this.x;
    const dy = this.chargeTarget.y - this.y;
    const distance = Math.sqrt(dx * dx + dy * dy);
    
    if (distance < 10) {
      this.isCharging = false;
      this.stunned = true;
      this.stunDuration = 60; // 1 second stun
      return;
    }

    const angle = Math.atan2(dy, dx);
    const newX = this.x + Math.cos(angle) * this.chargeSpeed;
    const newY = this.y + Math.sin(angle) * this.chargeSpeed;
    
    if (isValidPosition(newX, newY, this.size)) {
      this.x = newX;
      this.y = newY;
    } else {
      this.isCharging = false;
      this.stunned = true;
      this.stunDuration = 30; // 0.5 second stun on wall hit
    }
  }

  performAttack(player) {
    const attacks = [
      this.projectileAttack.bind(this),
      this.chargeAttack.bind(this),
      this.burstAttack.bind(this)
    ];
    
    let attackIndex;
    do {
      attackIndex = Math.floor(Math.random() * attacks.length);
    } while (attackIndex === this.lastAttackType);
    
    this.lastAttackType = attackIndex;
    attacks[attackIndex](player);
    
    // Shorter cooldown in later phases
    this.attackCooldown = this.attackInterval * (1.1 - this.phase * 0.2);
  }

  projectileAttack(player) {
    const angleToPlayer = Math.atan2(player.y - this.y, player.x - this.x);
    const projectileCount = this.phase === 3 ? 8 : this.phase === 2 ? 5 : 3;
    
    for (let i = 0; i < projectileCount; i++) {
      const spread = (Math.PI / 8) * (Math.random() - 0.5);
      const angle = angleToPlayer + spread;
      this.projectiles.push({
        x: this.x,
        y: this.y,
        dx: Math.cos(angle) * 5,
        dy: Math.sin(angle) * 5,
        size: 8,
        color: '#FF0000',
        damage: 10,
        lifetime: 120
      });
    }
  }

  chargeAttack(player) {
    this.isCharging = true;
    this.chargeTarget = {
      x: player.x,
      y: player.y
    };
  }

  burstAttack(player) {
    const projectileCount = this.phase === 3 ? 16 : this.phase === 2 ? 12 : 8;
    for (let i = 0; i < projectileCount; i++) {
      const angle = (i / projectileCount) * Math.PI * 2;
      this.projectiles.push({
        x: this.x,
        y: this.y,
        dx: Math.cos(angle) * 4,
        dy: Math.sin(angle) * 4,
        size: 6,
        color: '#FF00FF',
        damage: 8,
        lifetime: 90
      });
    }
  }

  updateProjectiles() {
    for (let i = this.projectiles.length - 1; i >= 0; i--) {
      const proj = this.projectiles[i];
      proj.x += proj.dx;
      proj.y += proj.dy;
      proj.lifetime--;
      
      // Remove projectiles that are out of bounds or expired
      if (proj.lifetime <= 0 || 
          proj.x < 0 || proj.x > dungeonWidth ||
          proj.y < 0 || proj.y > dungeonHeight) {
        this.projectiles.splice(i, 1);
        continue;
      }
      
      // Check collision with player
      const dx = proj.x - player.x;
      const dy = proj.y - player.y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      
      if (distance < (proj.size + player.size) / 2) {
        player.health -= proj.damage;
        this.projectiles.splice(i, 1);
      }
    }
  }
}


class Portal {
  constructor(x, y, size, color) {
    this.x = x;
    this.y = y;
    this.size = size;
    this.color = color;
  }

  render(ctx) {
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
  }
}

class Wall {
  constructor(x, y, width, height, color) {
    this.x = x;
    this.y = y;
    this.width = width;
    this.height = height;
    this.color = color;
  }

  render(ctx) {
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y, this.width, this.height);
  }

  intersects(x, y, size) {
    const playerLeft = x - size/2;
    const playerRight = x + size/2;
    const playerTop = y - size/2;
    const playerBottom = y + size/2;
    return !(
      playerRight < this.x ||
      playerLeft > this.x + this.width ||
      playerBottom < this.y ||
      playerTop > this.y + this.height
    );
  }
}

function getRandomWeaponType() {
  const types = ['Sword', 'Bow', 'Wand'];
  return types[Math.floor(Math.random() * types.length)];
}

function getWeaponStats(type) {
  const stats = {
    'Sword': { damage: 5, speed: 1 },
    'Bow': { damage: 10, speed: 1.2, projectileSpeed: 10 },
    'Wand': { damage: 15, speed: 1, projectileSpeed: 8 }
  };
  return stats[type];
}

function checkEnemyCollisions() {
  enemies.forEach(enemy => {
    if (player.intersects(enemy)) damagePlayer();
  });
}

function checkBossCollision() {
  if (boss && player.intersects(boss)) damagePlayer();
}

function damagePlayer() {
  player.health -= 10;
  if (player.health <= 0) gameOver = true;
}

function checkDungeonCompletion() {
  if (enemies.length === 0 && !boss) {
    dungeonLevel++;
    score += 100 * dungeonLevel;
    generateDungeon();
  } else if (enemies.length === 0 && boss && boss.health <= 0) {
    boss = null;
    score += 500 * dungeonLevel;
    generatePortal();
  }
}

function checkPortalCollision() {
  if (portal && player.intersects(portal)) {
    dungeonLevel++;
    score += 100 * dungeonLevel;
    player.health = 100;
    generateDungeon();
    portal = null;
  }
}

function updateEnemies() {
  enemies.forEach(enemy => enemy.update(player));
  if (boss) boss.update(player);
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(-cameraX, -cameraY);
  
  // Render dungeon boundary
  ctx.strokeStyle = 'white';
  ctx.strokeRect(0, 0, dungeonWidth, dungeonHeight);
  
  // Render game elements
  walls.forEach(wall => wall.render(ctx));
  weapons.forEach(weapon => weapon.render(ctx));
  enemies.forEach(enemy => enemy.render(ctx));
  if (boss) boss.render(ctx);
  if (portal) portal.render(ctx);
  projectiles.forEach(projectile => projectile.render(ctx));
  player.render(ctx);
  
  ctx.restore();
}

function renderGameOver() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.fillStyle = 'white';
  ctx.font = '48px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('Game Over', canvas.width/2, canvas.height/2 - 24);
  
  ctx.font = '24px Arial';
  ctx.fillText(`Final Score: ${score}`, canvas.width/2, canvas.height/2 + 24);
}
