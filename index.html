<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#000000" />

    <style>
      * {
        box-sizing: border-box;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        position: fixed;
        background: #000;
        font-family: sans-serif;
        color: #fff;
      }

      #container {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #gameWrapper {
        position: relative;
        width: 100%;
        height: 100%;
        max-width: 100vw;
        max-height: 100vh;
      }

      #gameCanvas {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      /* HUD Elements */
      #hud {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 10;
      }
      
      #healthBar {
        width: 150px;
        height: 20px;
        background: gray;
        border: 2px solid #fff;

      }
      
      #healthFill {
        height: 100%;

        width: 100%;
      }
      
      #scoreDisplay {
        font-size: 18px;
      }

      /* Inventory */
      #inventoryBar {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 10;
        display: flex;
        gap: 5px;
      }

      .invItem {
        width: 50px;
        height: 50px;
        border: 2px solid #fff;
        background: rgba(0, 0, 0, 0.5);
        cursor: pointer;
      }

      .invItem.active {
        border-color: gold;
      }

      #orientationPrompt {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        z-index: 1000;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 24px;
        padding: 20px;
      }

      #startScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.95);

      #startScreen button {
        padding: 15px 30px;

        background: #4a90e2;
        color: white;

        cursor: pointer;
      }

      #touchControls {
  display: none;
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 150px;
  z-index: 100;
}

#joystickArea {
  position: absolute;
  bottom: 20px;
  left: 20px;
  width: 120px;
  height: 120px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 50%;
}

#joystick {
  position: absolute;
  width: 50px;
  height: 50px;
  background: rgba(255, 255, 255, 0.5);
  border-radius: 50%;
  top: 35px;
  left: 35px;
}

#actionButton {
  position: absolute;
  bottom: 40px;
  right: 40px;
  width: 80px;
  height: 80px;
  background: rgba(255, 255, 255, 0.2);
  border: 2px solid #fff;
  border-radius: 50%;
  color: #fff;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

      @media (max-width: 768px) {
        #touchControls {
          display: block;
        }
        
        @media (orientation: portrait) {
          #orientationPrompt {
            display: flex;
          }
          #container {
            display: none;
          }
        }
      }

      @media (min-width: 769px) {
        #gameWrapper {
          aspect-ratio: 16/9;
          max-width: 1200px;
          max-height: 80vh;
        }
      }
    </style>
  </head>
  <body>
    <div id="orientationPrompt">
      <div>
        <img src="rotate-device.svg" alt="Rotate your device" style="width: 64px; height: 64px; margin-bottom: 20px;">
        <p>Please rotate your device to landscape mode to play</p>
      </div>
    </div>

    <div id="startScreen">
      <h1>Dungeon Crawler</h1>
      <button id="startButton">Start Game</button>
    </div>

    <div id="container">
      <div id="gameWrapper">
        <div id="hud">
          <div id="healthBar">
            <div id="healthFill"></div>
          </div>
          <div id="scoreDisplay">Score: 0</div>
        </div>
        <div id="inventoryBar"></div>
        <canvas id="gameCanvas"></canvas>
        
        <div id="touchControls">
  <div id="joystickArea">
    <div id="joystick"></div>
  </div>
  <button id="actionButton">Attack</button>
</div>
      </div>
    </div>

    <script>
      // Game Classes and Constants from your original code
      let canvas, ctx;
      let player;
      let enemies = [];
      let boss;
      let dungeonLevel = 1;
      let keys = {};
      let cameraX = 0, cameraY = 0;
      let dungeonWidth = 2000, dungeonHeight = 2000;
      let score = 0;
      let gameOver = false;
      let weapons = [];
      let currentWeapon = null;
      let inventory = [];
      let projectiles = [];
      let portal = null;
      let walls = [];
      let isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      let joystickPos = { x: 0, y: 0 };

      // Your original game classes
      class Player {
        constructor(x, y, size, color) {
          this.x = x;
          this.y = y;
          this.size = size;
          this.color = color;
          this.maxHealth = 100;
          this.health = this.maxHealth;
        }
        render(ctx) {
          ctx.fillStyle = this.color;
          ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
        }
        intersects(other) {
          const dx = this.x - other.x;
          const dy = this.y - other.y;
          return Math.sqrt(dx * dx + dy * dy) < (this.size + other.size) / 2;
        }
      }

      // [Include all your other class definitions: Enemy, Boss, Portal, Weapon, Projectile, Wall]
    

      // Mobile Controls Setup
      if (isMobile) {
        const joystick = document.getElementById('joystick');
        const joystickArea = document.getElementById('joystickArea');
        let joystickActive = false;

        joystickArea.addEventListener('touchstart', handleJoystickStart);
        joystickArea.addEventListener('touchmove', handleJoystickMove);
        joystickArea.addEventListener('touchend', handleJoystickEnd);

        function handleJoystickStart(e) {
          e.preventDefault();
          joystickActive = true;
          updateJoystickPosition(e.touches[0]);
        }

        function handleJoystickMove(e) {
          e.preventDefault();
          if (joystickActive) {
            updateJoystickPosition(e.touches[0]);
          }
        }

        function handleJoystickEnd(e) {
          e.preventDefault();
          joystickActive = false;
          joystick.style.transform = 'translate(0px, 0px)';
          joystickPos = { x: 0, y: 0 };
        }

        function updateJoystickPosition(touch) {
          const rect = joystickArea.getBoundingClientRect();
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          
          let x = touch.clientX - rect.left - centerX;
          let y = touch.clientY - rect.top - centerY;
          
          const maxDistance = rect.width / 2 - joystick.offsetWidth / 2;
          const distance = Math.sqrt(x * x + y * y);
          
          if (distance > maxDistance) {
            const angle = Math.atan2(y, x);
            x = Math.cos(angle) * maxDistance;
            y = Math.sin(angle) * maxDistance;
          }
          
          joystick.style.transform = `translate(${x}px, ${y}px)`;
          joystickPos = {
            x: x / maxDistance,
            y: y / maxDistance
          };

          // Update player movement based on joystick
          if (player) {
            const speed = 5;
            const newX = player.x + joystickPos.x * speed;
            const newY = player.y + joystickPos.y * speed;
            
            // Apply movement within bounds
            player.x = Math.max(Math.min(newX, dungeonWidth - player.size), player.size);
            player.y = Math.max(Math.min(newY, dungeonHeight - player.size), player.size);
          }
        }

        // Mobile Action Button
        document.getElementById('actionButton').addEventListener('touchstart', (e) => {
          e.preventDefault();
          if (currentWeapon) {
            if (currentWeapon.type === 'Bow' || currentWeapon.type === 'Wand') {
              shootProjectile(player.x + 50, player.y); // Shoot right by default on mobile
            } else {
              meleeAttack(player.x + 50, player.y);
            }
          }
        });
      }

      // Modified handlePlayerMovement for both mobile and desktop
      function handlePlayerMovement() {
        if (!player) return;
        
        const speed = 200 / 60;
        let newX = player.x;
        let newY = player.y;

        if (isMobile) {
          // Mobile movement using joystick position
          newX += joystickPos.x * speed;
          newY += joystickPos.y * speed;
        } else {
          // Desktop keyboard controls
          if (keys['a'] || keys['ArrowLeft']) newX -= speed;
          if (keys['d'] || keys['ArrowRight']) newX += speed;
          if (keys['w'] || keys['ArrowUp']) newY -= speed;
          if (keys['s'] || keys['ArrowDown']) newY += speed;
        }

        // Boundary and collision checks
        newX = Math.max(Math.min(newX, dungeonWidth - player.size), player.size);
        newY = Math.max(Math.min(newY, dungeonHeight - player.size), player.size);

        let collision = false;
        for (let wall of walls) {
          if (wall.intersects(newX, newY, player.size)) {
            collision = true;
            break;
          }
        }

        if (!collision) {
          player.x = newX;
          player.y = newY;
        }

        // Update camera position
        cameraX = Math.max(Math.min(player.x - canvas.width/2, dungeonWidth - canvas.width), 0);
        cameraY = Math.max(Math.min(player.y - canvas.height/2, dungeonHeight - canvas.height), 0);
      }

      // Canvas Resize Handler
      function resizeCanvas() {
        const wrapper = document.getElementById('gameWrapper');
        canvas.width = wrapper.offsetWidth;
        canvas.height = wrapper.offsetHeight;
      }

      // Initialize game
      function init() {
        canvas = document.getElementById('gameCanvas');
        ctx = canvas.getContext('2d');
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Initialize player and game elements
        player = new Player(400, 300, 20, 'red');
        generateDungeon();
        
        if (!isMobile) {
  document.addEventListener('keydown', keyDownHandler, false);
  document.addEventListener('keyup', keyUpHandler, false);
  canvas.addEventListener('mousedown', mouseDownHandler, false);
}

        // Start game loop
        requestAnimationFrame(gameLoop);
      }

      class Weapon {
  constructor(x, y, size, color, type) {
    this.x = x;
    this.y = y;
    this.size = size;
    this.color = color;
    this.type = type;
    this.stats = getWeaponStats(type);
  }

  render(ctx) {
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
    
    ctx.fillStyle = 'white';
    ctx.font = '12px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(this.type[0], this.x, this.y + 4);
  }

 use(x, y, targetX, targetY) {
  if (this.type === 'Bow') {
    const angle = Math.atan2(targetY - y, targetX - x);
    const speed = this.stats.projectileSpeed;
    return [new Projectile(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, 10, 'brown', this.stats.damage)];
  } else if (this.type === 'Wand') {
    const projectiles = [];
    for (let i = 0; i < 360; i += 45) {
      const angle = i * (Math.PI / 180);
      const speed = this.stats.projectileSpeed;
      projectiles.push(new Projectile(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, 10, 'blue', this.stats.damage));
    }
    return projectiles;
  } else {
    return { damage: this.stats.damage, range: this.size * 2 };
  }
}
}

class Projectile {
  constructor(x, y, dx, dy, size, color, damage) {
    this.x = x;
    this.y = y;
    this.dx = dx;
    this.dy = dy;
    this.size = size;
    this.color = color;
    this.damage = damage;
    this.active = true;
  }

  update() {
    this.x += this.dx;
    this.y += this.dy;
    
    if (this.x < 0 || this.x > dungeonWidth || 
        this.y < 0 || this.y > dungeonHeight) {
      this.active = false;
    }
  }

  render(ctx) {
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size/2, 0, Math.PI * 2);
    ctx.fill();
  }

  intersects(target) {
    const dx = this.x - target.x;
    const dy = this.y - target.y;
    const distance = Math.sqrt(dx * dx + dy * dy);
    return distance < (this.size + target.size) / 2;
  }
}

function keyDownHandler(e) {
  if (gameOver) return;
  keys[e.key.toLowerCase()] = true;
  
  // Prevent default for game controls
  if (['w', 'a', 's', 'd', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
    e.preventDefault();
  }
}

function keyUpHandler(e) {
  keys[e.key.toLowerCase()] = false;
}

function mouseDownHandler(e) {
  if (gameOver) return;

  const rect = canvas.getBoundingClientRect();
  const mouseX = e.clientX - rect.left + cameraX;
  const mouseY = e.clientY - rect.top + cameraY;

  if (currentWeapon) {
    if (currentWeapon.type === 'Bow' || currentWeapon.type === 'Wand') {
      shootProjectile(mouseX, mouseY);
    } else {
      meleeAttack(mouseX, mouseY);
    }
  }
}

function shootProjectile(targetX, targetY) {
  if (!currentWeapon) return;

  const projectiles = currentWeapon.use(player.x, player.y, targetX, targetY);
  if (projectiles) {
    projectiles.forEach(projectile => projectiles.push(projectile));
  }
}

function meleeAttack(targetX, targetY) {
  if (!currentWeapon) return;
  
  const attack = currentWeapon.use(player.x, player.y, targetX, targetY);
  const range = attack.range;
  const damage = attack.damage;
  
  // Check enemy hits
  enemies = enemies.filter(enemy => {
    const dx = enemy.x - player.x;
    const dy = enemy.y - player.y;
    const distance = Math.sqrt(dx * dx + dy * dy);
    
    if (distance <= range) {
      enemy.health -= damage;
      if (enemy.health <= 0) {
        score += 10;
        return false;
      }
    }
    return true;
  });
  
  // Check boss hit
  if (boss) {
    const dx = boss.x - player.x;
    const dy = boss.y - player.y;
    const distance = Math.sqrt(dx * dx + dy * dy);
    
    if (distance <= range) {
      boss.health -= damage;
      if (boss.health <= 0) {
        score += 100;
        boss = null;
      }
    }
  }
}

function updateProjectiles() {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const projectile = projectiles[i];
    projectile.update();
    
    // Check enemy hits
    enemies = enemies.filter(enemy => {
      if (projectile.active && projectile.intersects(enemy)) {
        enemy.health -= projectile.damage;
        projectile.active = false;
        if (enemy.health <= 0) {
          score += 10;
          return false;
        }
      }
      return true;
    });
    
    // Check boss hit
    if (boss && projectile.active && projectile.intersects(boss)) {
      boss.health -= projectile.damage;
      projectile.active = false;
      if (boss.health <= 0) {
        score += 100;
        boss = null;
      }
    }
    
    // Remove inactive projectiles
    if (!projectile.active) {
      projectiles.splice(i, 1);
    }
  }
}

function checkWeaponPickup() {
  weapons.forEach((weapon, index) => {
    if (player.intersects(weapon)) {
      inventory.push(weapon);
      weapons.splice(index, 1);
      if (!currentWeapon) currentWeapon = weapon;
      updateInventoryUI();
    }
  });
}

function updateInventoryUI() {
  const inventoryBar = document.getElementById('inventoryBar');
  inventoryBar.innerHTML = '';

  inventory.forEach((weapon, index) => {
    const slot = document.createElement('div');
    slot.className = 'invItem';
    if (currentWeapon === weapon) {
      slot.classList.add('active');
    }
    
    slot.innerHTML = `<div style="color: white; text-align: center; line-height: 50px;">${weapon.type[0]}</div>`;
    
    slot.addEventListener('click', () => {
      currentWeapon = weapon;
      updateInventoryUI();
    });

    if (!isMobile) {
      const keyHint = document.createElement('div');
      keyHint.style.position = 'absolute';
      keyHint.style.top = '2px';
      keyHint.style.left = '2px';
      keyHint.style.fontSize = '10px';
      keyHint.textContent = index + 1;
      slot.appendChild(keyHint);
    }

    inventoryBar.appendChild(slot);
  });
}
// Add keyboard shortcuts for inventory selection
document.addEventListener('keydown', (e) => {
  if (!isMobile) {
    const num = parseInt(e.key);
    if (num >= 1 && num <= inventory.length) {
      currentWeapon = inventory[num - 1];
      updateInventoryUI();
    }
  }
});

      function gameLoop() {
        if (!gameOver) {
          update();
          render();
        } else {
          renderGameOver();
        }
        requestAnimationFrame(gameLoop);
      }
	function generateDungeon() {
  enemies = [];
  boss = null;
  weapons = [];
  projectiles = [];
  portal = null;
  walls = [];

  // Generate walls
  for (let i = 0; i < 10; i++) {
    const wallX = Math.random() * (dungeonWidth - 200);
    const wallY = Math.random() * (dungeonHeight - 200);
    const wallWidth = 50 + Math.random() * 150;
    const wallHeight = 50 + Math.random() * 150;
    walls.push(new Wall(wallX, wallY, wallWidth, wallHeight, 'gray'));
  }

  // Generate enemies
  for (let i = 0; i < 10 + dungeonLevel * 2; i++) {
    const x = Math.random() * (dungeonWidth - 40) + 20;
    const y = Math.random() * (dungeonHeight - 40) + 20;
    const enemySize = 20 + dungeonLevel * 2;
    const enemyHealth = 20 + dungeonLevel * 5;
    enemies.push(new Enemy(x, y, enemySize, 'green', enemyHealth));
  }

  // Generate boss
  const bossX = Math.random() * (dungeonWidth - 60) + 30;
  const bossY = Math.random() * (dungeonHeight - 60) + 30;
  const bossSize = 40 + dungeonLevel * 5;
  const bossHealth = 100 + dungeonLevel * 50;
  boss = new Boss(bossX, bossY, bossSize, 'purple', bossHealth);

  // Generate weapon
  const weaponX = Math.random() * (dungeonWidth - 40) + 20;
  const weaponY = Math.random() * (dungeonHeight - 40) + 20;
  const weaponType = getRandomWeaponType();
  weapons.push(new Weapon(weaponX, weaponY, 20, 'brown', weaponType));

  updateInventoryUI();
}

function generatePortal() {
  const portalSize = 40;
  const portalX = Math.random() * (dungeonWidth - portalSize) + portalSize/2;
  const portalY = Math.random() * (dungeonHeight - portalSize) + portalSize/2;
  portal = new Portal(portalX, portalY, portalSize, 'yellow');
}

class Enemy {
  constructor(x, y, size, color, health) {
    this.x = x;
    this.y = y;
    this.size = size;
    this.color = color;
    this.health = health;
  }

  render(ctx) {
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
    const barWidth = 30, barHeight = 5;
    const barX = this.x - barWidth/2;
    const barY = this.y - this.size/2 - 10;
    ctx.fillStyle = 'limegreen';
    ctx.fillRect(barX, barY, barWidth * (this.health/100), barHeight);
    ctx.strokeStyle = 'black';
    ctx.strokeRect(barX, barY, barWidth, barHeight);
  }

  update(player) {
    const dx = player.x - this.x;
    const dy = player.y - this.y;
    const distance = Math.sqrt(dx * dx + dy * dy);
    if (distance < 300) {
      const speed = 1;
      this.x += (dx / distance) * speed;
      this.y += (dy / distance) * speed;
    }
  }
}

class Boss {
  constructor(x, y, size, color, health) {
    this.x = x;
    this.y = y;
    this.size = size;
    this.color = color;
    this.health = health;
    this.maxHealth = health;
  }

  render(ctx) {
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x - this.size / 2, this.y - this.size / 2, this.size, this.size);
    const barWidth = this.size, barHeight = 5;
    const barX = this.x - barWidth / 2;
    const barY = this.y - this.size / 2 - 10;
    ctx.fillStyle = 'limegreen';
    ctx.fillRect(barX, barY, barWidth * (this.health / this.maxHealth), barHeight);
    ctx.strokeStyle = 'black';
    ctx.strokeRect(barX, barY, barWidth, barHeight);
  }

  update(player) {
    const dx = player.x - this.x;
    const dy = player.y - this.y;
    const angle = Math.atan2(dy, dx);
    this.x += Math.cos(angle) * 1;
    this.y += Math.sin(angle) * 1;
  }
}
	    
class Portal {
  constructor(x, y, size, color) {
    this.x = x;
    this.y = y;
    this.size = size;
    this.color = color;
  }

  render(ctx) {
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
  }
}

class Wall {
  constructor(x, y, width, height, color) {
    this.x = x;
    this.y = y;
    this.width = width;
    this.height = height;
    this.color = color;
  }

  render(ctx) {
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y, this.width, this.height);
  }

  intersects(x, y, size) {
    const playerLeft = x - size/2;
    const playerRight = x + size/2;
    const playerTop = y - size/2;
    const playerBottom = y + size/2;
    return !(
      playerRight < this.x ||
      playerLeft > this.x + this.width ||
      playerBottom < this.y ||
      playerTop > this.y + this.height
    );
  }
}

function getRandomWeaponType() {
  const types = ['Sword', 'Bow', 'Wand'];
  return types[Math.floor(Math.random() * types.length)];
}

function getWeaponStats(type) {
  const stats = {
    'Sword': { damage: 5, speed: 1 },
    'Bow': { damage: 10, speed: 1.2, projectileSpeed: 10 },
    'Wand': { damage: 15, speed: 1, projectileSpeed: 8 }
  };
  return stats[type];
}

function checkEnemyCollisions() {
  enemies.forEach(enemy => {
    if (player.intersects(enemy)) damagePlayer();
  });
}

function checkBossCollision() {
  if (boss && player.intersects(boss)) damagePlayer();
}

function damagePlayer() {
  player.health -= 10;
  if (player.health <= 0) gameOver = true;
}

function generatePortal() {
  const portalSize = 40;
  const portalX = Math.random() * (dungeonWidth - portalSize) + portalSize / 2;
  const portalY = Math.random() * (dungeonHeight - portalSize) + portalSize / 2;
  portal = new Portal(portalX, portalY, portalSize, 'yellow');
}

function checkDungeonCompletion() {
  if (enemies.length === 0 && !boss) {
    dungeonLevel++;
    score += 100 * dungeonLevel;
    generateDungeon();
  } else if (enemies.length === 0 && boss && boss.health <= 0) {
    boss = null;
    score += 500 * dungeonLevel;
    generatePortal();
  }
}

function checkPortalCollision() {
  if (portal && player.intersects(portal)) {
    dungeonLevel++;
    score += 100 * dungeonLevel;
    player.health = 100;
    generateDungeon();
    portal = null;
  }
}

function updateEnemies() {
  enemies.forEach(enemy => enemy.update(player));
  if (boss) boss.update(player);
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(-cameraX, -cameraY);
  
  // Render dungeon boundary
  ctx.strokeStyle = 'white';
  ctx.strokeRect(0, 0, dungeonWidth, dungeonHeight);
  
  // Render game elements
  walls.forEach(wall => wall.render(ctx));
  weapons.forEach(weapon => weapon.render(ctx));
  enemies.forEach(enemy => enemy.render(ctx));
  if (boss) boss.render(ctx);
  if (portal) portal.render(ctx);
  projectiles.forEach(projectile => projectile.render(ctx));
  player.render(ctx);
  
  ctx.restore();
}

function renderGameOver() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.fillStyle = 'white';
  ctx.font = '48px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('Game Over', canvas.width/2, canvas.height/2 - 24);
  
  ctx.font = '24px Arial';
  ctx.fillText(`Final Score: ${score}`, canvas.width/2, canvas.height/2 + 24);
}
      function update() {
        handlePlayerMovement();
        checkEnemyCollisions();
        checkBossCollision();
        checkDungeonCompletion();
        updateProjectiles();
        checkWeaponPickup();
        updateEnemies();
        if (portal) checkPortalCollision();
        
        // Update HUD
        document.getElementById("healthFill").style.width = 
          (player.health / player.maxHealth * 150) + "px";
        document.getElementById("scoreDisplay").innerText = "Score: " + score;
      }


      // Start Screen Launch
      document.getElementById('startButton').addEventListener('click', () => {
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('container').style.display = 'flex';
        init();
      });

      // Service Worker Registration
      // PWA Service Worker Registration
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js')
          .then(reg => console.log('Service Worker registered', reg))
          .catch(err => console.error('Service Worker registration failed', err));
      }

    
    </script>
  </body>
</html>
