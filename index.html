<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f2b40" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Pickle Panic Runner</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="/public/assets/pwa/icon-192.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/public/assets/pwa/icon-192.svg" />
    <link rel="apple-touch-startup-image" href="/public/assets/pwa/splash.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-a: #1f2b40;
        --bg-b: #3f5f7f;
        --panel: rgba(16, 24, 36, 0.86);
        --ink: #f7f3d6;
        --accent: #ffb347;
        --shell-width: 960px;
        --shell-height: 540px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 10% 15%, #6d87a1 0%, var(--bg-b) 38%, var(--bg-a) 100%);
        color: var(--ink);
        font-family: "Trebuchet MS", "Verdana", sans-serif;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }

      #game-shell {
        width: var(--shell-width);
        height: var(--shell-height);
        aspect-ratio: 16 / 9;
        border: 0;
        border-radius: 0;
        overflow: hidden;
        box-shadow: none;
        background: #17202f;
      }

      canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        touch-action: none;
        image-rendering: pixelated;
      }

      .hint {
        position: fixed;
        bottom: calc(10px + env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        background: var(--panel);
        padding: 6px 12px;
        border-radius: 16px;
        font-size: 12px;
        max-width: min(92vw, 700px);
        text-align: center;
        line-height: 1.35;
      }

      @media (max-width: 820px) {
        .hint {
          font-size: 11px;
          padding: 5px 10px;
        }
      }
    </style>
  </head>
  <body>
    <div id="game-shell"></div>
    <div class="hint">Jump: Space/Up/W &middot; Pause: P or ESC</div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <script src="./public/levels.js"></script>
    <script>
      (() => {
        const BASE_WIDTH = 960;
        const BASE_HEIGHT = 540;
        const shell = document.getElementById("game-shell");

        const clampScaleStep = (scale) => {
          return scale;
        };

        const resizeShell = () => {
          const availableWidth = window.innerWidth;
          const availableHeight = window.innerHeight;
          const rawScale = Math.min(availableWidth / BASE_WIDTH, availableHeight / BASE_HEIGHT);
          const scale = clampScaleStep(rawScale);

          shell.style.setProperty("--shell-width", `${Math.round(BASE_WIDTH * scale)}px`);
          shell.style.setProperty("--shell-height", `${Math.round(BASE_HEIGHT * scale)}px`);
        };

        resizeShell();
        window.addEventListener("resize", resizeShell);
      })();
    </script>
    <script src="./public/game.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
