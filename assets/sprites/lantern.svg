<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#0000"/>
  <!-- Ornate Brass Lantern -->
  <rect x="5" y="1" width="6" height="1" fill="#8d6e63"/> <!-- Handle top -->
  <rect x="4" y="2" width="1" height="3" fill="#8d6e63"/> <!-- Handle side L -->
  <rect x="11" y="2" width="1" height="3" fill="#8d6e63"/> <!-- Handle side R -->
  
  <rect x="4" y="5" width="8" height="2" fill="#ffca28"/> <!-- Brass cap -->
  <rect x="5" y="7" width="6" height="6" fill="#fff8e1" fill-opacity="0.3"/> <!-- Glass panes -->
  
  <!-- Inner Flame -->
  <rect x="7" y="8" width="2" height="4" fill="#ff6f00"/> 
  <rect x="7" y="9" width="2" height="2" fill="#ffea00"/> <!-- Flame core -->
  
  <!-- Brass Frame -->
  <rect x="4" y="7" width="1" height="6" fill="#ffa000"/>
  <rect x="11" y="7" width="1" height="6" fill="#ffa000"/>
  <rect x="4" y="13" width="8" height="2" fill="#ffca28"/> <!-- Base -->
  <rect x="5" y="14" width="6" height="1" fill="#ffa000"/> <!-- Base shading -->
</svg>
