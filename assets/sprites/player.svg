<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#0000"/>
  <!-- Wizard Hat -->
  <rect x="5" y="0" width="6" height="1" fill="#4a148c"/> <!-- Tip -->
  <rect x="6" y="1" width="4" height="1" fill="#6a1b9a"/>
  <rect x="5" y="2" width="6" height="2" fill="#7b1fa2"/> <!-- Hat body -->
  <rect x="3" y="4" width="10" height="1" fill="#4a148c"/> <!-- Brim -->
  <rect x="7" y="3" width="2" height="1" fill="#ffd54f"/> <!-- Hat Buckle -->
  
  <!-- Face/Skin -->
  <rect x="5" y="5" width="6" height="3" fill="#f5c1a4"/>
  <rect x="6" y="6" width="1" height="1" fill="#000"/> <!-- Eye L -->
  <rect x="9" y="6" width="1" height="1" fill="#000"/> <!-- Eye R -->
  <rect x="5" y="7" width="6" height="1" fill="#e0a890"/> <!-- Shaded face/beard area -->

  <!-- Mage Robes -->
  <rect x="4" y="8" width="8" height="6" fill="#6a1b9a"/> <!-- Main Body -->
  <rect x="4" y="8" width="8" height="1" fill="#ffd54f"/> <!-- Gold Collar -->
  <rect x="3" y="8" width="1" height="4" fill="#6a1b9a"/> <!-- Sleeve L -->
  <rect x="12" y="8" width="1" height="4" fill="#6a1b9a"/> <!-- Sleeve R -->
  <rect x="3" y="11" width="1" height="1" fill="#f5c1a4"/> <!-- Hand L -->
  <rect x="12" y="11" width="1" height="1" fill="#f5c1a4"/> <!-- Hand R -->
  
  <!-- Robe Bottom/Trim -->
  <rect x="4" y="14" width="8" height="1" fill="#4a148c"/>
  <rect x="5" y="15" width="2" height="1" fill="#3e2723"/> <!-- Shoes -->
  <rect x="9" y="15" width="2" height="1" fill="#3e2723"/>
</svg>
