<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#0000"/>
  <!-- Slime Body (Translucent style) -->
  <rect x="3" y="6" width="10" height="7" rx="3" ry="3" fill="#4fc3f7" fill-opacity="0.8"/>
  <rect x="4" y="5" width="8" height="2" fill="#81d4fa" fill-opacity="0.9"/>
  <!-- Highlights (Gel look) -->
  <rect x="5" y="7" width="2" height="1" fill="#fff" fill-opacity="0.4"/>
  <!-- Eyes -->
  <rect x="5" y="9" width="2" height="2" fill="#263238"/>
  <rect x="9" y="9" width="2" height="2" fill="#263238"/>
  <!-- Core/Detail -->
  <rect x="7" y="10" width="2" height="2" fill="#0277bd" fill-opacity="0.5"/>
</svg>
