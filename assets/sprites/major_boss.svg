<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" shape-rendering="crispEdges">
  <rect width="24" height="24" fill="#0000"/>
  <!-- Dark Ancient Lich/Beholder -->
  <rect x="6" y="4" width="12" height="12" rx="4" fill="#311b92"/> <!-- Core body -->
  <!-- Horns/Wings -->
  <rect x="4" y="2" width="4" height="4" fill="#1a237e"/>
  <rect x="16" y="2" width="4" height="4" fill="#1a237e"/>
  <!-- Large Central Eye (Cthulhu vibe) -->
  <rect x="9" y="7" width="6" height="6" fill="#ffff00"/>
  <rect x="11" y="9" width="2" height="2" fill="#000"/> <!-- Pupil -->
  <!-- Ethereal Tentacles/Base -->
  <rect x="5" y="16" width="2" height="5" fill="#5e35b1"/>
  <rect x="11" y="17" width="2" height="6" fill="#5e35b1"/>
  <rect x="17" y="16" width="2" height="5" fill="#5e35b1"/>
  <!-- Shading -->
  <rect x="7" y="5" width="2" height="2" fill="#4527a0" fill-opacity="0.5"/>
</svg>
