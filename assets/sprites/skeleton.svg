<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#0000"/>
  <!-- Skeleton Bones -->
  <rect x="5" y="1" width="6" height="5" fill="#e0e0e0"/> <!-- Skull -->
  <rect x="4" y="6" width="8" height="1" fill="#bdbdbd"/> <!-- Neck/Collar -->
  <rect x="6" y="7" width="4" height="6" fill="#e0e0e0"/> <!-- Ribs/Spine -->
  <!-- Eyes -->
  <rect x="6" y="3" width="1" height="1" fill="#37474f"/>
  <rect x="9" y="3" width="1" height="1" fill="#37474f"/>
  <!-- Limbs -->
  <rect x="3" y="7" width="1" height="5" fill="#e0e0e0"/> <!-- Arm L -->
  <rect x="12" y="7" width="1" height="5" fill="#e0e0e0"/> <!-- Arm R -->
  <rect x="6" y="13" width="1" height="3" fill="#e0e0e0"/> <!-- Leg L -->
  <rect x="9" y="13" width="1" height="3" fill="#e0e0e0"/> <!-- Leg R -->
  <!-- Shadows/Depth -->
  <rect x="7" y="8" width="2" height="1" fill="#9e9e9e"/>
  <rect x="7" y="10" width="2" height="1" fill="#9e9e9e"/>
</svg>
