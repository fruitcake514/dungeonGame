<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#0000"/>
  <!-- Glass Flask -->
  <rect x="7" y="1" width="2" height="2" fill="#8d6e63"/> <!-- Cork -->
  <rect x="6" y="3" width="4" height="2" fill="#cfd8dc" fill-opacity="0.5"/> <!-- Neck -->
  
  <!-- Rounded Liquid Body -->
  <rect x="5" y="5" width="6" height="1" fill="#cfd8dc" fill-opacity="0.4"/> <!-- Glass shoulder -->
  <rect x="4" y="6" width="8" height="7" rx="3" fill="#ef5350"/> <!-- Red Potion liquid -->
  <rect x="5" y="13" width="6" height="1" fill="#c62828"/> <!-- Liquid shading -->
  
  <!-- Bubbles/Sparkle -->
  <rect x="6" y="8" width="1" height="1" fill="#ff8a80"/>
  <rect x="9" y="10" width="1" height="1" fill="#ff8a80"/>
  
  <!-- Glass Reflection -->
  <rect x="5" y="7" width="1" height="3" fill="#fff" fill-opacity="0.5"/>
  <rect x="6" y="6" width="2" height="1" fill="#fff" fill-opacity="0.3"/>
</svg>
